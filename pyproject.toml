[project]
name = "barkup"
version = "0.2.1"
description = "Barkup is a Python-based CLI tool for automating personal backups to local and cloud storage with support for Google Drive."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "pydantic>=2.12.5",
]
keywords = ["backup", "cli", "incremental", "google-drive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/abu-bilaall/barkup"
Issues = "https://github.com/abu-bilaall/barkup/issues"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["barkup"]

[project.scripts]
barkup = "barkup.cli:cli"

[tool.pytest.ini_options]
pythonpath = "src"

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "standard"
include = ["src"]
reportFunctionMemberAccess = "none"

[tool.black]
target-version = ['py312']
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Lint only (real errors: unused imports, undefined names, etc.).
# Import sorting and formatting are owned by black, so "I" is not selected
# to avoid reordering imports across the whole codebase.
select = ["F"]
