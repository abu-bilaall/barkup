[project]
name = "barkup"
version = "0.1.0"
description = "Barkup is a Python-based CLI tool for automating personal backups to local and cloud storage with support for Google Drive."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "ruff>=0.15.22",
]

[project.scripts]
barkup = "cli:cli"

[tool.pytest.ini_options]
pythonpath = "src"

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "standard"

[tool.black]
target-version = ['py312']
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Lint only (real errors: unused imports, undefined names, etc.).
# Import sorting and formatting are owned by black, so "I" is not selected
# to avoid reordering imports across the whole codebase.
select = ["F"]
