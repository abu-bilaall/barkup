[project]
name = "barkup"
version = "0.1.0"
description = "Barkup is a Python-based CLI tool for automating personal backups to local and cloud storage with support for Google Drive."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = "src"

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "standard"

[tool.black]
target-version = ['py312']
line-length = 88
