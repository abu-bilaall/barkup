# Barkup Configuration File
# Edit this file to configure backup sources, destinations, etc.

# =====================
# General Settings
# =====================
[general]
# fields specific to this section
profile_name = "barkup-anton" # Name of this backup profile
dry_run = false # Whether to enable dry-run mode (no actual copying)

# 'sources', 'compression', and 'exclude' defined here
# serve as fallbacks for [local] and [[cloud_providers]]
# if they don't define their own.

# List of directories to back up
sources = ["/home/user/Documents", "/home/user/Pictures"]

# Whether to compress backups with ZIP
# When true, plain files are stored as .zip archives (already-compressed
# formats like .zip/.jpg/.mp3 are skipped automatically); restore
# decompresses them transparently.
compression = false

# what to exclude, support pattern-matching
exclude = ["*.tmp", ".git", "node_modules"]


# =====================
# Local Backup Settings
# =====================
[local]

# Local destination path
destination = "/mnt/backups"

# 'exclude' defined in local and cloud sections 
# merge with general's exclude list
exclude = [".tmp*"]


# =====================
# Cloud Providers
# =====================
[[cloud_providers]]
# fields specific to this section
provider = "google_drive"
enabled = true
large_file_warning = 100 # MB threshold, default is 100

# optional fields, fall back to general defaults if not defined
sources = ["/home/user/Documents", "/home/user/Pictures"]
compression = false
exclude = ["*.tmp", ".git", "node_modules"]

# Google Drive specific fields
credentials_file = "/home/user/.barkup/google_drive.json"
remote_folder = "Backups/Barkup"

# =====================
# Advanced / Optional
# =====================
[advanced]
# Temporary directory for staging backups
temp_dir = "/tmp/barkup"
